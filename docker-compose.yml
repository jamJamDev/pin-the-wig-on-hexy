# Production stack for "A True Freudian Experience" (internal: pin-the-wig-on-hexy).
#
# Public access is ONLY via the Cloudflare tunnel: cloudflared dials OUTBOUND, so
# no host ports are published and the origin is never directly reachable -- no port
# scanning, no WAF bypass, origin IP hidden. That is the single biggest security win.
#
#   Internet -> Cloudflare edge (TLS/WAF/DDoS/cache) -> cloudflared
#                                                          -> caddy  (static + headers + cache)
#                                                                \-> /api/* -> api (leaderboard)
name: ptwoh

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ptwoh-api:latest
    restart: unless-stopped
    networks: [app]
    volumes:
      - ptwoh_data:/app/data            # leaderboard persistence -- survives restarts/rebuilds
    read_only: true                      # immutable root fs; the only writable path is the volume
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75

  caddy:
    image: caddy@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794  # caddy:2-alpine
    restart: unless-stopped
    networks: [app, edge]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ./src:/srv/src:ro
      - ./assets:/srv/assets:ro
      - caddy_data:/data                 # Caddy state (image declares /data and /config as volumes)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE                 # the caddy binary carries this file cap; required to exec it
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0  # :latest (2026.5.2)
    restart: unless-stopped
    networks: [edge]
    depends_on:
      caddy:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run"]
    # TUNNEL_TOKEN comes from the gitignored root .env (auto-loaded by Compose for
    # interpolation); the empty default lets build/pull run before the token is set
    # and keeps the stack parseable on a baseline Compose 2.x host.
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.50

networks:
  app:
    driver: bridge
    internal: true      # caddy <-> api only; no route off the host at all
  edge:
    driver: bridge      # cloudflared needs outbound to reach Cloudflare's edge

volumes:
  ptwoh_data:
  caddy_data:
